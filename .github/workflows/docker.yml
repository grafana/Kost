# See https://docs.docker.com/build/ci/github-actions/multi-platform/
name: Build and Push Image

on:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read
  id-token: write

env:
  # Docker image tags. See https://github.com/docker/metadata-action for format
  TAGS_CONFIG: |
    type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
    type=sha,prefix={{ branch }}-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
    type=semver,pattern={{ version }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        with:
          persist-credentials: false
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and push
        uses: grafana/shared-workflows/actions/docker-build-push-image@b1ec01ab2a1a6ba0b0dc6643ccefc498a98a3654
        with:
          registries: gar
          gar-environment: prod
          gar-repository: dockerhub-kost-prod-mirror
          gar-image: kost
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS_CONFIG }}
